<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle - enjoy.</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <header class="fistook-header">
        <img class="fistook-logo__image" src="assets/logo.png" alt="Fistook Wordle">
    </header>

    <main class="game" aria-label="Wordle game">
        <p id="message" class="message" aria-live="polite">Loading game…</p>
        <div id="board" class="board" aria-label="Guess board"></div>
        <div id="keyboard" class="keyboard" aria-label="On-screen keyboard"></div>
        <button id="new-game-button" class="new-game-button" type="button" hidden>New game</button>
    </main>

    <script src="js/index.js"></script>
</body>
</html>
